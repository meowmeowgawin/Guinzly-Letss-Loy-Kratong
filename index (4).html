<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loy Krathong Night</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#140f38;--amber:#ffb347;--pink:#ff6b9a;--lilac:#b79ae0;--cream:#fff3dc;color-scheme:dark}
input{user-select:text;-webkit-user-select:text;touch-action:auto}
#wish{margin-top:8px}
#wish .row{display:flex;gap:6px}
#wish input{flex:1;min-width:0;font:600 16px Mali,Sarabun,sans-serif;padding:10px 14px;border-radius:99px;border:2px solid var(--amber);background:#140f38;color:var(--cream);outline:none}
#wish input::placeholder{color:#fff3dc88}
#wish .btn{margin:0;padding:8px 16px;font-size:16px;white-space:nowrap}
#wish .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
#wish .chips button{font:600 13px Mali,sans-serif;color:var(--cream);background:#3d2d85;border:2px solid var(--lilac);border-radius:99px;padding:5px 10px;cursor:pointer}

#hint{max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@media (orientation:landscape) and (max-height:620px){
.card{width:min(800px,100%);padding:10px 16px;border-radius:22px}
.card h2{font-size:18px;margin:0 0 2px}
.card p{margin:3px 0;line-height:1.35;font-size:14px}
.card:has(#gm){display:grid;grid-template-columns:minmax(150px,30%) 1fr;column-gap:16px;align-items:center;text-align:left}
.card:has(#gm)>h2{grid-column:1;grid-row:1;align-self:end}
.card:has(#gm)>p{grid-column:1;grid-row:2;align-self:start}
.card:has(#gm)>#gm{grid-column:2;grid-row:1/span 3;min-width:0}
#gm canvas{width:min(100%,calc(80vh*var(--r,1.4)))!important;margin:4px auto!important}
.card:has(#gm.rv){display:block;text-align:center}
#gm.bt canvas{width:min(100%,calc(54vh*var(--r,1.4)))!important}
#gm.rv{display:flex;gap:12px;align-items:center;justify-content:center}
#gm.rv canvas{width:min(56%,calc(60vh*var(--r,1.4)))!important;margin:0!important}
#gm.rv #wish{flex:1;margin-top:0;min-width:0}
.card:has(#hero){display:grid;grid-template-columns:150px 1fr;column-gap:18px;align-items:center;text-align:left}
#hero{grid-row:1/span 4;width:150px;height:auto!important;justify-self:center}
.card:has(#hero)>.btn{justify-self:start}
.tray button{width:54px;height:54px;font-size:28px}
#kb{height:110px}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Mali,Sarabun,sans-serif;color:var(--cream);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px)}
.hud>*{pointer-events:auto}
.pill{background:rgba(20,15,56,.75);border:2px solid var(--amber);color:var(--cream);border-radius:99px;padding:6px 12px;font:600 14px Mali,sans-serif}
button.pill,.btn,.tray button{cursor:pointer}
#ttl{margin-right:auto;color:var(--amber);font-weight:700;border-color:transparent;background:none}
#go{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:none;font-size:20px;padding:12px 26px;background:var(--amber);color:var(--ink);border-color:var(--cream);box-shadow:0 0 26px #ffb347aa}
#ov{position:fixed;inset:0;background:rgba(10,7,36,.8);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
.card{position:relative;width:min(440px,100%);max-height:96%;overflow:auto;touch-action:pan-y;background:linear-gradient(160deg,#37286f,#1b1445);border:3px solid var(--amber);border-radius:26px;padding:16px;text-align:center}
.card h2{margin:0 0 4px;font-size:22px;color:var(--amber)}
.card p{margin:6px 0;line-height:1.45}
.fact{background:#ffffff14;border-radius:14px;padding:10px}
.btn{background:var(--amber);color:var(--ink);border:0;border-radius:99px;padding:10px 22px;font:700 17px Mali,sans-serif;margin:6px 4px 0}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--cream);font-size:20px;cursor:pointer}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tray button{width:62px;height:62px;font-size:32px;border-radius:18px;border:2px solid var(--lilac);background:#3d2d85}
.tray button.big{width:auto;min-width:120px;font:600 16px Mali,sans-serif;padding:6px 10px;color:var(--cream)}
.tray button.big span{display:block;font-size:30px}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sh{animation:sh .25s}
#kb{height:140px;position:relative;background:linear-gradient(#1a7fa0,#0d3f73);border-radius:18px;overflow:hidden}
#kb span{position:absolute;transform:translateX(-50%)}
.lore{display:flex;gap:8px;text-align:left;align-items:flex-start;margin:6px 0}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="ttl"></div><div class="pill" id="st"></div><button class="pill" id="bk">📖</button><button class="pill" id="lg"></button></div>
<button class="pill" id="go"></button>
<div id="ov"></div>
